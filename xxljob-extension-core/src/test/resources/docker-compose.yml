# xxl-job-admin 真实集成测试用 Docker Compose
# 使用方法：
#   docker compose -f src/test/resources/docker-compose.yml up -d
#   等待 xxl-job-admin 启动完成（约 30 秒）
#   XXL_JOB_ADMIN_URL=http://localhost:8080/xxl-job-admin mvn verify
#   docker compose -f src/test/resources/docker-compose.yml down -v

services:
  xxl-job-mysql:
    image: mysql:8.0
    container_name: xxl-job-test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: xxl_job
      MYSQL_USER: xxl_job
      MYSQL_PASSWORD: xxl_job123
    ports:
      - "33060:3306"
    volumes:
      - xxl-job-mysql-data:/var/lib/mysql
      # xxl-job-admin 镜像不含 DDL，外部挂载 SQL 在首次启动时自动执行
      - ./tables_xxl_job.sql:/docker-entrypoint-initdb.d/01-tables_xxl_job.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 30

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.0
    container_name: xxl-job-test-admin
    depends_on:
      xxl-job-mysql:
        condition: service_healthy
    environment:
      PARAMS: >-
        --server.port=8080
        --server.servlet.context-path=/xxl-job-admin
        --spring.datasource.url=jdbc:mysql://xxl-job-mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=xxl_job
        --spring.datasource.password=xxl_job123
        --xxl.job.accessToken=test_token_2026
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/xxl-job-admin/actuator/health || curl -sf http://localhost:8080/xxl-job-admin/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  xxl-job-mysql-data:
